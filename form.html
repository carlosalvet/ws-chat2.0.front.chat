<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <div id="status">Conectando...</div>
    <div id="messages"></div>

    <script>
        // Crear conexión WebSocket
        const socket = new WebSocket('ws://10.33.241.239:8081');
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');

        // Evento cuando la conexión se abre
        socket.onopen = function(event) {
            statusDiv.textContent = 'Conectado al servidor WebSocket';
            console.log('Conexión establecida');
            
            // Enviar mensaje "Hola mundo" cuando se conecte
            socket.send('Hola mundo');
            addMessage('Enviado: Hola mundo');
        };

        // Evento cuando se recibe un mensaje
        socket.onmessage = function(event) {
            console.log('Mensaje recibido:', event.data);
            addMessage('Recibido: ' + event.data);
        };

        // Evento cuando hay error
        socket.onerror = function(error) {
            statusDiv.textContent = 'Error en la conexión';
            console.error('Error WebSocket:', error);
        };

        // Evento cuando se cierra la conexión
        socket.onclose = function(event) {
            statusDiv.textContent = 'Conexión cerrada';
            console.log('Conexión cerrada:', event.code, event.reason);
        };

        // Función para agregar mensajes al DOM
        function addMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.textContent = message;
            messagesDiv.appendChild(messageElement);
        }
    </script>
</body>
</html>
