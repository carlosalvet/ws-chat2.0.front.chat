<html lang="es-MX">
<head>
  <link rel="stylesheet" type="text/css" href="chat/css/style.css">
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
  </style>

</head>
  
  <body>
    <div id="container">
      <div id="ws-chat" class="border-shadow">
        <input type="hidden" name="chat-id" value="2" />
        <input type="hidden" name="chat-title" value="Perdida de la Patria Potestad" />
        <input type="hidden" name="chat-description" value="¿Estás hart@ de que te peguen?" />
        <input type="hidden" name="chat-notification" value='Para poder enviar mensajes da click en el botón "invitado" para registrarte. Presiona el botón "iniciar sesión" y participa' />
        <input type="hidden" name="chat-date" value="2022-06-30" />
        <div class="ws-container">
          <div class="ws-title">
          	<img src="chat/images/logo.png" />
          	<label class="ws-chat-title">&nbsp;</label>
          	<label class="status-connection"></label>
          	<div class="ws-icons">
          	  <img src="chat/images/close-icon.png" onclick="WS_SelectionButtons.show('select-role')" class="ws-btn" />
          	</div>
          </div>
          <div class="ws-window border-shadow">
            <div id="notification-area">
              <div class="ws-notificacion-screen"></div>
            </div>
            <div id="messages-area" class="msg-area"></div>    
          </div>

          <div class="ws-bottom">
            <div class="buttons-wrapper">
              <div class="ws-role-buttons">
                <button class="ws-btn ws-btn ws-btn-green" id="auth-expert" onclick="WS_SelectionButtons.show('auth-expert')">Iniciar Sesión</button>
                <button class="ws-btn ws-btn-gray" id="auth-citizen" onclick="WS_SelectionButtons.show('auth-citizen')">Invitado</button>
              </div>
              
              <div class="auth-expert-interface hidden">
                  <input type="text" name="expert-name" placeholder="usuario" />
                  <input type="text" name="expert-pass" placeholder="contraseña" />
                  <button name="expert-form-cancel" class="ws-btn ws-btn-red" onclick="WS_SelectionButtons.show('select-role')"/>Cancelar</button>
                  <button name="expert-form-submit" class="ws-btn ws-btn-green" onclick="authenticate_expert(ws)">Iniciar Sesión</button>
              </div>
              
              <div class="auth-citizen-interface hidden">
                <input name="guess-name" type="text" placeholder="Escribe tu nombre"/>
                <button class="ws-btn ws-btn-green" onclick="authenticate_citizen(ws)">Iniciar Sesión</button>
              </div>

              <div class="ws-send-message hidden">
                <input type="text" name="ws-msg" class="ws-txt" placeholder="Bienvenido, escribe tu mensaje" />
                <button class="ws-btn-submit ws-btn ws-btn-violet" onclick="api_send_message(this, ws)">Enviar</button>
              </div>
              <script>
              </script>

            </div>
        </div>
      </div>
    </div>
</body>

<script src="js/settings.js"></script>
<script src="js/config.js"></script>

<script src="chat/js/doms/WS_ChatDOM.js"></script>
<script src="chat/js/models/WS_Chat.js"></script>
<script src="chat/js/controllers/WS_ChatController.js"></script>

<script src="chat/js/doms/WS_SelectionButtons.js"></script>

<script src="chat/js/functionalities/callbacks.js"></script>

<script src="js/websocket/settings.js"></script>
<script src="js/websocket/connection/ws_connect.js"></script>
<script src="js/websocket/events/websocket.js"></script>

<script src="chat/js/reacts/chat_get.js"></script>

<script src="chat/js/doms/WS_MessageDOM.js"></script>

<script src="chat/js/models/WS_User.js"></script>
<script src="chat/js/models/WS_Message.js"></script>

<script src="chat/js/helpers/Comp_MsgAdminHelper.js"></script>

<script>
    'use strict';
    let node_chat = dom_get_node('#ws-chat')
    let chat_id = node_chat.querySelector('input[name=chat-id]').value

    init_chat(chat_id)
</script>
